<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./css/space.css">
  <script type="module" src="./js/space.js"></script>

  <title>Space!</title>
</head>
<body>
  <div class="the-great-beyond" data-parallax-sensitivity="10">
    <div class="plax plax-bg noplax-scale" style="z-index: -5">
      <img class="space-bg" src="./img/dblue003_FlipFilter (5).png">
    </div>
    <div class="plax z-1">
      <img
        class="floater stuster-a"
        src="./img/hdf_pixelized_transparent_extended_rounded.png"
      >
    </div>
    <div class="plax z4">
      <img
        class="floater stuster-b"
        src="./img/deep_field_remix.png"
      >
    </div>
    <div class="plax z4">
      <img class="floater stuster-b stuster-b-2" src="./img/deep_field_remix.png">
    </div>
    <div class="plax z5">
      <img class="floater stuster-b stuster-b-3" src="./img/deep_field_remix.png">
    </div>
    <div class="plax z3">
      <img class="floater stuster-b stuster-b-4" src="./img/deep_field_remix.png">
    </div>
    <div class="plax z4">
      <img class="floater stuster-b stuster-b-5" src="./img/deep_field_remix.png">
    </div>
    <div class="plax z6">
      <img class="floater stuster-b stuster-b-6" src="./img/deep_field_remix.png">
    </div>

    <div class="black-hole">
      Put a black hole gif here
      Connect it to a white hole
      Make clicking it jump to the white hole
    </div>
  </div>
  <div
    class="tiled-layer"
    data-src="./img/foreground_stars.png"
    data-speed="1.8"
    data-scale="1"
  ></div>
</body>
</html>
