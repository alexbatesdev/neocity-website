<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piinro Post</title>

    <link rel="stylesheet" href="./css/index.css" />

    <link rel="stylesheet" href="/css/hexBackground.css" />
    <script src="../js/hexBackground.js" defer></script>
  </head>
  <body class="hexBackground">
    <div class="room-bounds">
      <img src="./img/lavalamp.gif" alt="lava lamp" class="lava-lamp">
      <div class="bub-interface">
      </div>
      <div class="floor">
        <img class="window" src="./img/Fenster_7.gif" alt="window" />
        <img src="./img/rug.png" alt="Rug from animal crossing" class="rug">
        <div class="cat">
          <div class="bub-sm">
            <div class="bub-md">
              <div class="bub-lg">
                <img src="./img/bub-lg.png" alt="large bubble" />
              </div>
              <img src="./img/bub-md.png" alt="medium bubble" />
            </div>
            <img src="./img/bub-sm.png" alt="small bubble" />
          </div>
          <div class="z-sm">
            <div class="z-md">
              <div class="z-lg">
                <img src="./img/z-lg.png" alt="large Z" />
              </div>
              <img src="./img/z-md.png" alt="medium Z" />
            </div>
            <img src="./img/z-sm.png" alt="lil Z" />
          </div>
          <img src="./img/cat.png" alt="sleeping cat" />
        </div>
      </div>
    </div>
  </body>
</html>
